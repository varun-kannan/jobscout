name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

      # A binary that fails to compile is a broken release, so the build is
      # checked on every push rather than only at tag time.
      - run: bun run build
      - run: ./dist/jobscout --help
