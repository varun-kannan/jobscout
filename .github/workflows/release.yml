name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            name: jobscout-macos-arm64
            runs-on: macos-latest
          - target: bun-darwin-x64
            name: jobscout-macos-x64
            runs-on: macos-latest
          - target: bun-linux-x64
            name: jobscout-linux-x64
            runs-on: ubuntu-latest
          - target: bun-linux-arm64
            name: jobscout-linux-arm64
            runs-on: ubuntu-latest
          - target: bun-windows-x64
            name: jobscout-windows-x64.exe
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Compile
        run: |
          bun build src/index.ts --compile \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.name }}

      # Only the host-architecture binary can actually be run here; the others
      # are cross-compiled and merely checked for existence.
      - name: Smoke test
        if: matrix.target == 'bun-darwin-arm64' || matrix.target == 'bun-linux-x64'
        run: ./dist/${{ matrix.name }} --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
